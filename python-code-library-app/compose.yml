---
services:
  db:
    image: srikanth0209/project:py_db
    deploy:
      replicas: 1
      restart_policy :
        condition: none
      resources :
        limit:
          cpus: "0.5"
          memory: "1024M"
        reservations:
          cpus: "0.25"
          memory: "512M"
    ports:
      - "3306:3306"
    networks:
      - mynetwork

  auth_service:
    image: srikanth0209/project:py_auth
    deploy:
      replicas: 1
      restart_policy :
        condition: any
      resources :
        limit:
          cpus: "0.5"
          memory: "1024M"
        reservations:
          cpus: "0.25"
          memory: "512M"
    ports:
      - "5001:5001"
    networks:
      - mynetwork
    depends_on:
      - db
    

  book_service:
    image: srikanth0209/project:py_book
    deploy:
      replicas: 1
      restart_policy :
        condition: any
      resources :
        limit:
          cpus: "0.5"
          memory: "1024M"
        reservations:
          cpus: "0.25"
          memory: "512M"
      restart_policy :
        condition: any
    ports:
      - "5002:5002"
    networks:
      - mynetwork
    depends_on:
      - db
  borrow_service:
    image: srikanth0209/project:py_borrow
    deploy:
      replicas: 1
      restart_policy :
        condition: any
      resources :
        limit:
          cpus: "0.5"
          memory: "1024M"
        reservations:
          cpus: "0.25"
          memory: "512M"
    ports:
      - "5003:5003"
    networks:
      - mynetwork
    depends_on:
      - db

  frontend:
    image: srikanth0209/project:py_frontend
    deploy:
      replicas: 1
      restart_policy :
        condition: any
      resources :
        limit:
          cpus: "0.5"
          memory: "1024M"
        reservations:
          cpus: "0.25"
          memory: "512M"
    ports:
      - "5000:5000"
    networks:
      - mynetwork
    depends_on:
      - auth_service
      - book_service
      - borrow_service

networks:
  mynetwork:
    driver: overlay
